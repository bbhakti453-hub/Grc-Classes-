<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRC Classes</title>

<style>

body{
margin:0;
font-family:Arial;
background:#081229;
color:white;
}

header{
background:#111c35;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:30px;
font-weight:bold;
color:#4ea1ff;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
margin:5px;
}

.hero{
padding:40px;
text-align:center;
}

.card-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#162544;
padding:20px;
border-radius:20px;
text-align:center;
}

input,select{
width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:none;
}

.form-box{
background:#162544;
max-width:400px;
margin:auto;
padding:20px;
border-radius:20px;
}

</style>
</head>

<body>

<header>
<div class="logo">GRC Classes</div>

<div>
<button>Login</button>
<button>Register</button>
</div>

</header>

<section class="hero">

<h1>Welcome To GRC Classes</h1>

<p>
Mock Tests | Live Classes | Videos | Notes
</p>

<button>CBSE Board</button>
<button>UP Board</button>

</section>

<div class="card-container">

<div class="card">
<h2>Mock Tests</h2>
<p>Online Test With Result</p>
<button>Start Test</button>
</div>

<div class="card">
<h2>Live Classes</h2>
<p>Join Daily Live Classes</p>
<button>Join Now</button>
</div>

<div class="card">
<h2>Videos</h2>
<p>Watch Recorded Classes</p>
<button>Watch</button>
</div>

<div class="card">
<h2>Notes</h2>
<p>Download Notes</p>
<button>Open</button>
</div>

</div>

<section class="form-box">

<h2>Student Registration</h2>

<input type="text" placeholder="Full Name">

<input type="text" placeholder="Mobile Number">

<input type="password" placeholder="Password">

<input type="date">

<select>
<option>Select Board</option>
<option>CBSE</option>
<option>UP Board</option>
</select>

<select>
<option>Select Class</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
<option>Class 11</option>
<option>Class 12</option>
</select>

<button>Create Account</button>

</section>

<section class="hero">

<h2>Contact Us</h2>

<p>Phone: 73 5186 9345</p>

<p>Email: grcclasses111@gmail.com</p>

</section>

</body>
</html>
